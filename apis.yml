name: Instabee
description: >-
  Instabee is a European last-mile logistics technology company formed by the 2022 merger of Instabox
  and Budbee, operating consumer delivery brands Instabox (Sweden, Denmark, Norway), Budbee (Sweden,
  Denmark, Finland, the Netherlands, Belgium) and Porterbuddy (Norway). It moves tens of millions of
  parcels a year across parcel lockers, home delivery and returns for 1,150+ merchant clients through
  45+ parcel terminals, serving 10M+ active users. Instabee exposes a public REST developer API under
  the Budbee brand for creating and managing delivery orders, booking delivery intervals, discovering
  lockers/boxes and serviceable postal codes, generating shipping labels, booking returns, and
  subscribing to parcel-status webhooks across its Nordic and Benelux network.
